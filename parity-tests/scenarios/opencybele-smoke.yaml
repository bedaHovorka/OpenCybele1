# The first scenario that runs a REAL implementation.
#
# smoke-stub.yaml proves the SPI with no application present; this one proves the same pipeline
# against the OpenCybele baseline through OpenCybeleLauncher (#13) -- build a command line, start a
# child JVM by path, capture the merged stream, scan it for throwables, classify the exit status,
# assert liveness, normalize and compare a golden. Scenario coverage proper is #23.
#
# Format: docs/parity-harness.md.

id: opencybele-smoke
description: >
  Bounded 25 s (simulated) headless run of the reference implementation with the canonical trace
  probe on, at a pinned seed. All twenty sim.* keys are declared here; the run takes nothing from
  an application default and nothing from a file on another branch.

# ---------------------------------------------------------------------------------------------
# WHY summary AND NOT strict OR causal -- REVISED BY #21, AND THE REASON HAS CHANGED
#
# It is no longer the normalizer. #21 has landed (docs/trace-normalizer.md) and it projects all six
# run-varying value families, sorts the startup block by agent name, canonicalises order inside a
# burst, and splits the two application printlns into independent streams. Measured over 52
# headless captures of this application: ZERO ordering differences remain. Before it, 13 captures
# produced 13 distinct traces.
#
# What blocks `strict` here is ONE NUMBER IN THIS FILE, and it is `sim.stop.maxClockMs`.
#
# At this seed the trace's last event burst BEGINS at simulated 25072 -- 72 ms after the 25000
# bound -- so those 16 lines are emitted while the run is already inside its shutdown window and
# racing Cybele.terminate(). Measured over 38 runs at this bound: 26 produced the full 623 lines,
# 1 produced 611, 3 produced 609 and 8 produced 607. A truncated tail is MISSING LINES, and no
# normalisation invents a line a run never printed -- the same rule that makes DEF-02 unfixable
# here. (One further run in the 38 was a DEF-02 drop, at 591 lines.)
#
#   * `strict` and `causal` both fail on that, at the same rate: 25 of 38. They fail identically
#     because causal compares the unattributed bucket -- every STATION_INFO, ROAD_STATE and
#     PATH_FIND line -- in order and with NO tolerance, and the truncated burst is full of them.
#   * `summary` absorbs it: the loss is ~2 lines per family, which is what the tolerances below
#     were measured against. So `summary` remains the strongest level that actually holds FOR THIS
#     BOUND.
#
# THE FIX IS NOT MINE TO MAKE. Moving the bound to 24000 puts it inside the 1952 ms gap between the
# burst ending at 23120 and the one beginning at 25072, and it is also 2776 simulated ms clear of
# the last train creation -- i.e. FURTHER from the Cybele.terminate() NPE hazard this file sized
# 25000 against, not nearer. Measured at 24000: 14 of 14 captures byte-identical, and the shipped
# zero-flake gate is 10 for 10. That configuration is checked in as parity-tests/scenarios/
# opencybele-strict.yaml with its own golden, because changing the bound HERE would mean
# re-recording this golden and Phase1.md L7 makes that an expensive thing to do on someone else's
# issue.
#
# #23: fold the two. They differ in exactly one number and this one is the weaker of the pair.
#
# NOTE ON THIS GOLDEN. It was NOT re-recorded. ScenarioRunner normalizes the golden with the same
# normalizer before comparing, and CanonicalTraceNormalizer is idempotent, so the file recorded
# under #12's placeholder still matches -- which is exactly what Phase1.md L7 requires.
#
# WHAT summary DOES AND DOES NOT BUY, SAID PLAINLY
#
# A contract level and its rule set are two different things, and it is the rule set that decides
# what a replay can get away with. The first version of this file counted six families -- 154 of
# the golden's 623 lines -- which meant a port could emit not one VOTE line and still pass, since
# comparison is symmetric. The whole distributed election is the system's core algorithm and the
# thing #34 is expected to restructure, so that was the worst available blind spot. Every one of
# the fifteen channels is counted below, plus both printlns and the kernel banner: 623 of 623
# golden lines are now inside some rule.
#
# It is still a COUNT contract. A rule proves the family exists at the right cardinality, not that
# any individual line's payload is right. Pinning content needs a bound that does not land in the
# shutdown window; opencybele-strict.yaml has one.
# ---------------------------------------------------------------------------------------------
contract: summary
golden: opencybele-smoke.txt

launcher:
  # Deliberately NO `config:` key. Every knob this run depends on is written out here, so the
  # golden depends on the application binary and on nothing else -- not on the content of a
  # scenarios/*.properties file that lives on another branch and could be edited there, and not on
  # an application default that could be changed there. (The adapter does support `config:`;
  # OpenCybeleLauncherIT covers that path.)
  #
  # ALL TWENTY sim.* KEYS ARE HERE, including the ten that happen to sit at their current default:
  # the topology, the station capacities and the road delays are precisely what a port has to
  # replicate, and leaving them implicit would mean a change to a baseline default silently
  # invalidates this golden. Declaring them is behaviour-neutral -- three runs with the ten added
  # produce byte-identical event counts to the run this golden was recorded from.
  #
  # OpenCybeleSmokeIT asserts EVERY key below back out of the child's own resolved-configuration
  # banner, exact-matched and anchored. That is what makes "the properties arrived" a total claim
  # rather than a sampled one: a single dropped -D is caught by name, not left to show up as a
  # count drift inside a tolerance.
  properties:
    # --- arrivals -------------------------------------------------------------------------
    sim.arrival.lambdaMs: "2000"          # default 8500 -- densest rate measured to reproduce
    sim.arrival.firstFireMs: "200"        # default 1000
    sim.arrival.pairs: "stA>stB,stA>stC,stB>stA,stB>stC,stC>stB,stC>stA"   # = current default
    # --- topology, capacities, delays: what a port must replicate -------------------------
    sim.topology: "stA-stH:tr1,stH-stG:tr2,stG-stE:tr3,stE-stD:tr4,stD-stB:tr5,stF-stE:tr6,stC-stF:tr7"
    sim.station.capacities: "stA=6,stB=5,stC=2,stD=2,stE=5,stF=2,stG=3,stH=2"
    sim.road.delaysSec: "tr1=1,tr2=1,tr3=5,tr4=2,tr5=3,tr6=4,tr7=3"
    sim.station.voteWindowMs: "2000"      # kept equal to lambda; see scenarios/short.properties
    # --- clock ----------------------------------------------------------------------------
    sim.clock.startMs: "0"                # = current default
    sim.clock.pace: "8"                   # default 1 -- wall-clock lever only, 8 sim s per real s
    # --- GUI: inert under sim.headless=true, declared so nothing at all is implicit --------
    sim.gui.paces: "Fast=8,Normal=1,Slow=0.3"
    sim.gui.mainLine: "stA,stH,stG,stE,stD,stB"
    sim.gui.branches: "stC:tr7,stF:tr6"
    # --- randomness -----------------------------------------------------------------------
    sim.random.masterSeed: "20080415"     # default: a DRAWN number. A golden is recorded against
                                          # a seed, never against a draw.
    # --- run shape ------------------------------------------------------------------------
    sim.headless: "true"                  # default false -- no display, and no Swing in a golden
    sim.trace.enabled: "true"             # default false -- the canonical trace is the contract (#20)
    sim.trace.trainLookahead: "32"        # = current default; the probe's name window
    sim.stop.maxTrains: "0"               # = current default (off); the clock bound is used instead
    # -----------------------------------------------------------------------------------------
    # THE BOUND, AND WHY IT IS 25000 AND NOT A ROUND 30000
    #
    # `Cybele.terminate()` tears the comm service down while agent threads are still running, so a
    # train agent whose constructor is in flight at the stop instant reaches
    # `Activity.openChannel` after `commReceiver` has been nulled and the kernel prints
    #
    #     *** Activity.init  ->
    #     ... Caused by: java.lang.NullPointerException: Cannot invoke
    #         "cybele.comm.CommReceiver.requestChannel(...)" because "commReceiver" is null
    #         at cz.vutbr.fit.ags.xhovor07.Train.<init>(Train.java:54)
    #
    # AFTER the stop banner. That is a baseline shutdown defect, not a harness one, and the error
    # scan is right to fail on it -- so this scenario does not exempt it. It avoids it instead.
    #
    # A train agent is created at PLAN time, so the exposure is the wall-clock gap between the last
    # arrival and the bound. At this seed the arrivals land at simulated 1328, 4136, 9872, 12984,
    # 15944, 17552, 18248, 18536, 21224, 27328, ... A bound of 30000 sits 0-40 simulated ms after
    # an arrival, i.e. ~5 ms of wall clock at pace 8: measured 1 failure in the first full-suite
    # run, 1 in 10 unloaded and 4 in 10 under an 8-way CPU load. A bound of 25000 sits inside the
    # 6.1 s arrival gap, ~3.8 s of simulated time past the last arrival and ~2.3 s before the next,
    # i.e. ~480 ms of wall clock clear of the last train creation: measured 0 in 14 runs under the
    # same 8-way load and 0 in 10 unloaded harness runs, with identical counts throughout.
    #
    # So this number is load-bearing. Moving it is not a cosmetic edit -- re-derive the gap from
    # the PLAN_TRAIN ticks first.
    # -----------------------------------------------------------------------------------------
    sim.stop.maxClockMs: "25000"          # default 0 (off). The bound. ~3.1 s wall at pace 8.
    sim.stop.wallClockMs: "60000"         # default 0 (off). Safety net; exit 3, never a pass.
    sim.stop.stallMs: "10000"             # default 0 (off). Generation died; exit 4, never a pass.
                                          # Sized above the 6.1 s arrival gap (762 ms wall).

run:
  # Well above the child's own 60 s safety net, because this is the backstop for the case where the
  # child's net did NOT fire: ~1 run in 45 hangs outright with a clean process and nothing in the
  # stream (DEF-22), which sim.stop.stallMs structurally cannot catch -- it measures the gap
  # between generated trains, and a hang after the last one leaves no gap to grow. Killing the
  # child is reported as HARNESS_TIMEOUT and can never pass.
  harnessTimeoutMs: 120000
  expect: bound-reached

# Mandatory, and load-bearing here rather than ceremonial: the failure this catches is a run that
# exits 0, prints a stop banner and contains not one line to grep for, because a throwable in
# Generator.generateTrain stopped generation before its timer re-armed. Floors sit well under the
# measured values so that ordinary drift is not a failure, while a dead or gutted run is.
#
# Liveness matches RAW lines, so these patterns see the trace before any projection -- which is why
# they carry the `tick` field that #21 will later project away.
liveness:
  # The generator ran.
  - pattern: '^(vl\d+)\|\d+\|PLAN_TRAIN\|'
    distinctGroup: 1
    atLeast: 6
  # Every train that was planned got through a full election. This is the rule that a port which
  # restructures the CountDownLatch protocol (#34) has to keep satisfying: 9 distinct trains reach
  # VOTE_RESULT in every measured run, loaded or not.
  - pattern: '^(vl\d+)\|\d+\|VOTE_RESULT\|'
    distinctGroup: 1
    atLeast: 6
  # The movement protocol and the destructor ran, per train.
  - pattern: '^(vl\d+)\|\d+\|TRAIN_STATE\|'
    distinctGroup: 1
    atLeast: 6
  # Trains actually departed -- the application's own two printlns, which predate the probe.
  - pattern: '^vl\d+ started$'
    atLeast: 3
  - pattern: '^(vl\d+) in st[A-H] at \d+$'
    distinctGroup: 1
    atLeast: 3
  # The static objects reported state too, so a port that emits only train lines fails here.
  - pattern: '^st[A-H]\|\d+\|STATION_INFO\|'
    atLeast: 25
  - pattern: '^tr\d+\|\d+\|ROAD_STATE\|'
    atLeast: 20

# Field 1 of a canonical line is the SUBJECT of the message, and for eleven of the fifteen channels
# that is a train -- so this reads the entity id with no payload scanning. Station and track lines
# carry no train and land in the unattributed bucket, which `summary` does not compare.
#
# Entity patterns match NORMALIZED lines (liveness ones match raw), which is why this pattern is
# written against the canonical shape rather than copied from a liveness rule above.
entity:
  pattern: '^(vl\d+)\|'
  group: 1
  # Measured: 9 distinct trains in every one of 3 unloaded and 14 CPU-saturated runs. One either
  # way absorbs the watchdog's 10 ms poll landing on the far side of an arrival -- the bound stops
  # the run "at or just past" 25000 simulated ms, not exactly on it.
  tolerance:
    missing: 1
    extra: 1

# ---------------------------------------------------------------------------------------------
# ONE RULE PER CHANNEL, plus the two printlns and the kernel banner: 623 of 623 golden lines are
# counted. Nothing in the trace is outside a rule, so a family that vanishes from a replay is a
# failure by name rather than a silence.
#
# Every count was measured on 3 unloaded runs and 14 runs under an 8-way CPU load. Two groups
# behave differently and the tolerances say so:
#
#   * The election families and PLAN_TRAIN/START are IDENTICAL in all 17 runs -- 93/93/93, 9, 5.
#     They complete long before the bound, so the prompt halt cannot clip them. Tolerance 2 is
#     margin, not observed drift.
#   * The movement and state families lose exactly 2 lines under saturation, every time: the run
#     is halted promptly once the bound fires and the last in-flight messages are simply never
#     printed. Tolerance 3 is the observed 2 plus one.
#
# The first version of this file used 6 here, which was slack nobody had measured -- and slack is
# what let a whole dropped property hide as a 2-line drift. Tolerances are measurements.
# ---------------------------------------------------------------------------------------------
summary:
  # --- the election: the system's core algorithm, and #34's target ------------------------
  - label: vote-requests             # 93 in 17/17 runs
    pattern: '\|VOTE_REQUEST\|'
    tolerance: 2
  - label: votes                     # 93 in 17/17 runs
    pattern: '\|VOTE\|'
    tolerance: 2
  - label: vote-results              # 93 in 17/17 runs
    pattern: '\|VOTE_RESULT\|'
    tolerance: 2
  # --- planning and departure -------------------------------------------------------------
  - label: trains-planned            # 9 in 17/17 runs
    pattern: '\|PLAN_TRAIN\|'
    tolerance: 1
  - label: starts                    # 5 in 17/17 runs
    pattern: '\|START\|'
    tolerance: 1
  - label: departures                # 5 in 17/17 -- the application's own println
    pattern: '^vl\d+ started$'
    tolerance: 1
  - label: departure-printlns        # 5 in 17/17 -- the other println, kept in the contract
    # `at <T>`, not `at \d+`: summary patterns match NORMALIZED lines and #21 projects the
    # departure instant away (docs/trace-normalizer.md, rule `departure`). Left as `\d+` this rule
    # counted 0 on both sides and passed no matter what the run did -- a lock that cannot fail.
    # ScenarioRunner now rejects a summary rule that counts 0 in the golden, so it cannot recur
    # silently.
    pattern: '^vl\d+ in st[A-H] at <T>$'
    tolerance: 1
  # --- the movement protocol --------------------------------------------------------------
  - label: enter-events              # 38 unloaded, 36-37 saturated
    pattern: '\|ENTER\|'
    tolerance: 3
  - label: enter-replies             # 38 unloaded, 36 saturated
    pattern: '\|ENTER_REPLY\|'
    tolerance: 3
  - label: leave-events              # 35 unloaded, 33 saturated
    pattern: '\|LEAVE\|'
    tolerance: 3
  - label: travel-starts             # 18 unloaded, 17 saturated
    pattern: '\|TRAVEL_START\|'
    tolerance: 2
  - label: travel-ends               # 15 unloaded, 14-15 saturated
    pattern: '\|TRAVEL_END\|'
    tolerance: 2
  # --- path finding -----------------------------------------------------------------------
  - label: path-finds                # 15 unloaded, 14-15 saturated
    pattern: '\|PATH_FIND\|'
    tolerance: 2
  - label: path-find-replies         # 15 unloaded, 14 saturated
    pattern: '\|PATH_FIND_REPLY\|'
    tolerance: 2
  # --- static-object state ----------------------------------------------------------------
  - label: train-state-events        # 49 unloaded, 47 saturated
    pattern: '\|TRAIN_STATE\|'
    tolerance: 3
  - label: station-info-events       # 48 unloaded, 46 saturated
    pattern: '\|STATION_INFO\|'
    tolerance: 3
  - label: road-state-events         # 40 unloaded, 38 saturated
    pattern: '\|ROAD_STATE\|'
    tolerance: 3
  # --- the kernel banner ------------------------------------------------------------------
  # 9 lines of fixed text emitted before anything else, byte-identical every run
  # (docs/trace-format.md). It survives the diagnostic filter and is in the golden, so it gets a
  # rule like everything else -- at tolerance 0, because there is nothing for it to drift with.
  - label: kernel-banner             # 9 in 17/17 runs
    pattern: '^(Cybele version |\.\.\. Cybele started|\*\*\* Loading )'
    tolerance: 0
