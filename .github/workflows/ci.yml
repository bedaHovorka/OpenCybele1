# CI for OpenCybele1 --- four jobs, two implementations, one set of frozen goldens.
#
# RENAMED from `characterization-opencybele.yml` by #40. It stopped being a file about one
# implementation the moment the JADE lane arrived, and the next rename is #52's (`@jason`) if it
# needs one. Job names are unchanged; only the file moved.
#
#   build@this-ref              compile + the L1 unit lane (321 tests) + domainPurity, on the ref
#                               that was pushed. Added by #79 after four PRs merged into a CI that
#                               had been red on a stale rule for the project's entire history.
#   integrationTest@this-ref    the L2 lane: real in-process JADE containers, one JVM per class.
#   characterizationIT@opencybele   the DRIFT GUARD (#25). Builds the application from the frozen
#                               `opencybele-baseline` and runs the L3 suite against it. Must never
#                               go red for any reason other than "someone changed the baseline".
#   characterizationIT@jade     the PORT GUARD (#40). Same suite, same goldens, the application
#                               built from THIS ref. Read the design note in
#                               `.github/scripts/parity-junit.sh` above `jade-status)` before
#                               touching its verdict: this lane is judged against a recorded
#                               measurement, not against "all five green", and the reason is
#                               measured rather than pragmatic.
#
# WHAT THIS WORKFLOW GUARDS, narrowly and specifically: the baseline is declared frozen for the
# whole migration, and every golden the port is measured against was recorded from it. If the
# baseline drifts, the goldens stop describing anything and the drift is discovered as a mysterious
# diff during the port. This makes that drift a red build instead. Since #40, the same suite also
# runs against the port, so the two arms answer different questions on every push.
#
# THREE THINGS ABOUT THIS PROJECT THAT A NAIVE WORKFLOW GETS WRONG. All three are measured; see
# docs/ci.md for the full write-up.
#
#   1. For the OPENCYBELE arm, the harness and the application live on DIFFERENT BRANCHES
#      (decision #11). The parity harness is on `jade-develop`; the OpenCybele implementation is on
#      `opencybele-baseline`, and `OpenCybeleLauncher` (#13) reaches it BY PATH as a child JVM,
#      with no compile dependency. So that job checks out both, builds the application on one, and
#      runs the suite on the other pointed at it with `-Popencybele.dist`.
#
#      For the JADE arm this is not so, and it is the one real simplification #40 gets: the harness
#      and the JADE implementation are the same tree. ONE checkout, `installDist`, `-Pjade.dist`.
#
#   2. The vendor jars are not in git. `Cybele.jar`/`CybeleImpl.jar` are 2008-era IAI binaries with
#      no public Maven repo, excluded by .gitignore and reachable only through the `withoutGradle`
#      tag. `scripts/bootstrap-vendor-jars.sh` (#14) recovers and installs them, and works with no
#      `mvn` on PATH. It is the single call this workflow makes; the install commands are NOT
#      duplicated here.
#
#      The JADE jobs need it too, even though `src/main` has ZERO `cybele.*` references since #35:
#      `build.gradle.kts` still declares `com.iai:cybele-api`/`cybele-impl` on `implementation`, so
#      the two jars are still resolved and still land in `installDist`'s lib/. Dropping them is a
#      1-POST cleanup and NOT #40's: the child JVM's `-cp` is part of the command line every
#      measurement in docs/parity-triage-jade.md was taken under, and this lane's margins are 3--9
#      ms wide. That is not a classpath to change as a side effect of a CI ticket.
#
#   3. A green Gradle exit does not mean a good run. Three separate ways, all measured on this
#      repository: without `-Popencybele.dist` the end-to-end test is SKIPPED by `assumeTrue` and
#      Gradle still reports BUILD SUCCESSFUL; a Test task that discovers zero tests exits 0; and
#      the JADE lane's Gradle status is non-zero on almost every run BY DESIGN (see the job).
#      So no run is believed until `.github/scripts/parity-junit.sh` has read the JUnit XML.
#
# No secrets, no tokens, no network beyond the Gradle/JDK downloads the actions do themselves.

name: CI

on:
  push:
    # `develop` is the default branch and the one Phase1.md 1-PRE.4 names; `jade-develop` is where
    # the harness actually lives today and where this file lands first. Feature branches are NOT
    # listed on purpose -- they get this job through their pull request instead, which halves the
    # number of runs for the same coverage.
    #
    # NOT LISTED, AND IT MATTERS: `opencybele-baseline`. A push-triggered workflow is read from the
    # tree of the ref that was pushed, and that branch carries no `.github/` and no harness, so
    # listing it would change nothing. A push to the baseline -- the exact event this job exists to
    # catch -- therefore does not trigger it. The `schedule` below is the cover for that; see the
    # caveat on it.
    branches:
      - develop
      - jade-develop
  pull_request:
    branches:
      - develop
      - jade-develop

  # Nightly, to cover the case above: a change to `opencybele-baseline` that no pull request into
  # `develop`/`jade-develop` ever touched.
  #
  # CAVEAT, stated rather than hidden: GitHub only ever runs `schedule` and `workflow_dispatch` from
  # the workflow file as it exists on the DEFAULT branch. Until this file is merged to `develop`,
  # both of these triggers are inert -- `push`/`pull_request` are the ones doing the work. Nothing
  # here needs changing when that merge happens; they simply start firing.
  #
  # #40 LOOKED AT FIXING THIS AND DELIBERATELY DID NOT. It stays #75's, for three reasons:
  #
  #   * None of #40's three jobs depends on it. All four jobs in this file are `push`/
  #     `pull_request`-triggered on the ref under test, which works today. Adding a second `cron:`
  #     entry "for the JADE lane" would be WORSE than adding nothing: it would be equally inert and
  #     would read, to the next person, as cover that exists.
  #   * The inertness is a property of WHERE THIS FILE LIVES, not of any job in it. The two fixes
  #     #75 lists are (a) merge the workflow to `develop`, which is a decision about the frozen 2008
  #     default branch and is nowhere near a CI-jobs ticket, or (b) drive the baseline from a
  #     push-triggered job with an explicit `opencybele-ref`. Both change the OPENCYBELE arm.
  #   * #40 does shrink the gap without touching the trigger, and the residue is worth naming
  #     exactly. `characterizationIT@opencybele` already runs on every push and PR to
  #     `jade-develop`, so the baseline is exercised on every change to this branch. What remains
  #     uncovered is precisely one event: a push made straight to `opencybele-baseline` with no PR
  #     anywhere. That, and only that, is what the inert nightly was the cover for.
  schedule:
    - cron: '17 3 * * *'

  workflow_dispatch:
    inputs:
      opencybele-ref:
        description: 'Branch, tag or SHA of the OpenCybele application to run the suite against.'
        required: false
        default: 'opencybele-baseline'

# A superseded push is not worth a runner: in-progress runs of the same branch are cancelled when a
# newer commit lands, and two branches never cancel each other.
#
# `github.event_name` IS PART OF THE GROUP, and that is the whole point of this block. Without it a
# scheduled run and a push run on `develop` share `refs/heads/develop` and therefore share a group,
# so a 03:17 push cancels the nightly -- and the nightly is the only cover for the one event this
# job cannot otherwise see, a push straight to `opencybele-baseline` (see the `on:` block).
#
# `cancel-in-progress: ${{ github.event_name != 'schedule' }}` does NOT fix that, although it reads
# as though it should. GitHub evaluates this property on the run being QUEUED, and it governs what
# that run does to runs already in progress. So the push -- whose own value would be `true` --
# would still cancel the running nightly; all the condition would buy is that a nightly never
# cancels a running push, which is not the problem. Separating the groups is what actually keeps
# the two from contending, so they are separated here.
#
# (Reasoned from the documented semantics rather than measured: concurrency behaviour cannot be
# exercised off a hosted runner.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. This job reads two branches and writes nothing back; it needs no token beyond the one
# `actions/checkout` uses to clone.
permissions:
  contents: read

env:
  # Where each of the two checkouts lands, relative to the workspace.
  HARNESS_DIR: harness
  OPENCYBELE_DIR: opencybele
  # Everything a failed run should be able to show afterwards is collected here.
  EVIDENCE_DIR: ci-evidence
  # See "the retry, and why there is one" on each run step. 1 disables retrying.
  MAX_ATTEMPTS: '2'

  # Where the JADE lane's recorded measurement lives. Read the header of that file before changing
  # a row in it; it is the thing `characterizationIT@jade` judges a run against.
  JADE_EXPECTED: .github/parity/jade-status.expected

  # THE PER-JOB SKIP ACCOUNTING (#78's rule, #40's generalisation). Every class listed here must be
  # skipped ENTIRELY in the job that lists it -- "all of it is opt-in HERE" is the only thing that
  # earns an exemption, and a class that skipped some of its tests and ran the rest still fails.
  # Any skip outside these lists fails the job.
  #
  # `ParityGateIT` is on both lists: it is the opt-in N-consecutive-runs lane, gated on
  # `-Dparity.gate.runs`, which neither job passes (it is minutes, not seconds).
  #
  # The rest is symmetric and structural, not incidental. `JadeParityIT` skips in the opencybele
  # job because that job supplies no `-Pjade.dist`; the six `OpenCybele*` scenario classes skip in
  # the jade job because it supplies no `-Popencybele.dist`. Each arm's scenarios are the other
  # arm's expected skips -- which is also the empirical answer to "why can the JADE lane not just be
  # a sixth scenario in the existing job": the two need different dists, and each one's scenarios
  # assume themselves away in the other's.
  OPENCYBELE_EXPECTED_SKIPS: >-
    cz.vutbr.fit.ags.parity.it.ParityGateIT
    cz.vutbr.fit.ags.parity.it.JadeParityIT
  JADE_EXPECTED_SKIPS: >-
    cz.vutbr.fit.ags.parity.it.ParityGateIT
    cz.vutbr.fit.ags.parity.it.OpenCybeleSmokeIT
    cz.vutbr.fit.ags.parity.it.OpenCybeleStrictIT
    cz.vutbr.fit.ags.parity.it.OpenCybeleCapacityIT
    cz.vutbr.fit.ags.parity.it.OpenCybeleCongestionIT
    cz.vutbr.fit.ags.parity.it.OpenCybeleLifecycleIT
    cz.vutbr.fit.ags.parity.it.OpenCybeleTimersIT

  # The measured tallies of the two white-box lanes, as FLOORS rather than pins: adding tests never
  # breaks them, losing them does. Both verified locally at c9a3dd7 (`./gradlew clean build` ->
  # 321/0/0/0, `./gradlew integrationTest` -> 17/0/0/0 across 8 classes).
  UNIT_TEST_FLOOR: '321'
  INTEGRATION_TEST_FLOOR: '17'

jobs:
  # ---------------------------------------------------------------------------------------------
  # The PORT guard (#75). The job above builds the application from `opencybele-baseline` and
  # therefore never compiles the branch under test -- from #30 onward `src/main` is a JADE
  # application that does not run under Cybele at all (see #4's sequencing comment), so that job
  # will keep reporting green while testing a different program.
  #
  # This job is the honest port-side check until #36's JadeLauncher makes the JADE implementation
  # executable by the harness: `./gradlew build` on THIS ref -- compilation plus every unit suite
  # (domain, ontology, clock, and the ported agents' behaviour-as-POJO tests).
  #
  # It needs the vendor jars for the same reason the tree still compiles mid-port: the un-ported
  # Cybele classes are still there. It does NOT need `installDist` and does not start the
  # application, because during 1-PORT there is no runnable application to start.
  # ---------------------------------------------------------------------------------------------
  port-build:
    name: build@this-ref
    runs-on: ubuntu-24.04
    # Measured locally at ~7 s of Gradle work. 15 minutes is a runaway guard, not a budget.
    timeout-minutes: 15

    steps:
      - name: Check out this ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `bootstrap-vendor-jars.sh` restores the untracked jars from the `withoutGradle` tag,
          # so the tag has to be in the clone. The default fetch-depth of 1 does not carry tags.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Bootstrap the vendored Cybele jars
        run: scripts/bootstrap-vendor-jars.sh

      - name: Build and run every unit suite
        run: ./gradlew --no-daemon --console=plain --stacktrace build

      # The assertion Gradle's exit status cannot make, for the third time in this file. A Test
      # task that discovers ZERO tests exits 0 and writes no reports; one whose testClassesDirs
      # stopped matching writes a handful and exits 0 too. Neither is visible in a green tick, and
      # `build` would keep passing while running nothing. The floor is the measured tally.
      # No `if: always()`, on the opencybele arm's precedent: when Gradle itself fails, the Gradle
      # failure is the one worth reading, and a second "no reports found" on top of it is noise.
      # The case this step exists for -- a lane that discovers nothing and exits 0 -- reaches it.
      #
      # The two variables are exported in the shell rather than passed through `${{ env.* }}`,
      # because the workflow-level `env:` block is already in this step's environment and one
      # indirection is enough.
      - name: Assert the L1 lane actually ran
        run: |
          set -euo pipefail
          export PARITY_MIN_TESTS="$UNIT_TEST_FLOOR"
          # No lane-level exemptions: this suite has no opt-in class and 0 skips, measured.
          export PARITY_OPT_IN_CLASSES=""
          chmod +x .github/scripts/parity-junit.sh
          .github/scripts/parity-junit.sh assert-suite build/test-results/test

      - name: Publish the unit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: port-build-test-results
          path: build/test-results/test/**/*.xml
          if-no-files-found: warn

  characterization-it:
    # The name the milestone refers to, and the shape #40 (@jade) and #52 (@jason) will clone:
    # same steps, a different implementation checkout and a different `-P<impl>.dist`.
    name: characterizationIT@opencybele
    runs-on: ubuntu-24.04
    # Measured end to end locally at ~30 s of Gradle work (6 s to build the application, 20 s for
    # the suite). 20 minutes is a runaway guard, not a budget: the scenario's own harness timeout is
    # 120 s per attempt and the child's wall-clock net is 60 s, so anything approaching this ceiling
    # is a stuck runner rather than a slow suite.
    timeout-minutes: 20

    steps:
      # ---------------------------------------------------------------------------------------
      # 1 -- the two checkouts.
      # ---------------------------------------------------------------------------------------
      - name: Check out the parity harness (this ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.HARNESS_DIR }}

      - name: Check out the OpenCybele application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.opencybele-ref || 'opencybele-baseline' }}
          path: ${{ env.OPENCYBELE_DIR }}
          # The vendor jars are recovered by `git checkout withoutGradle -- cybelle/*.jar`, so this
          # clone needs the tag and the commit it points at, and the default shallow single-branch
          # fetch has neither.
          #
          # It is NOT true that the default would break the bootstrap: measured against
          # actions/checkout's exact default fetch, the script's own "tag not found locally, trying
          # git fetch --tags" fallback deepened the shallow clone, recovered the tag and restored
          # both jars (git 2.55.0). The reason to set this is different and still good: it makes
          # recovery deterministic and takes an in-job `git fetch` to the remote off the critical
          # path, instead of leaving a build step depending on a network call that the checkout
          # step has already paid for.
          fetch-depth: 0

      # ---------------------------------------------------------------------------------------
      # 2 -- the toolchain. JDK 21 is what `build.gradle.kts` pins on both branches; providing it
      #      here keeps Gradle's toolchain resolution local (no auto-provisioning download).
      # ---------------------------------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Caches the wrapper distribution and the dependency caches, and validates every
          # `gradle-wrapper.jar` in the workspace against Gradle's published checksums -- worth
          # having in a repository that ships two committed wrapper jars and has never had CI.
          validate-wrappers: true
          # The open-source GitHub Actions cache rather than the default commercial service: this
          # job must not depend on a third party or on any credential.
          cache-provider: basic
          # The action's own default is "read-only unless this is the default branch", which on
          # `jade-develop` would mean the cache is never written and every run is a cold one.
          # Write from a push, read from a pull request (a PR cannot be allowed to poison the
          # cache other branches read).
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # ---------------------------------------------------------------------------------------
      # 3 -- the vendor jars.
      # ---------------------------------------------------------------------------------------
      - name: Restore the local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Narrow on purpose. Only the two vendored artifacts are installed here; everything else
          # Gradle resolves goes to the Gradle caches the step above manages.
          path: ~/.m2/repository/com/iai
          key: m2-com-iai-${{ runner.os }}-${{ hashFiles(format('{0}/scripts/bootstrap-vendor-jars.sh', env.OPENCYBELE_DIR)) }}
          restore-keys: |
            m2-com-iai-${{ runner.os }}-

      - name: Bootstrap the vendored Cybele jars
        working-directory: ${{ env.OPENCYBELE_DIR }}
        # ONE call. The script recovers cybelle/*.jar from the `withoutGradle` tag if they are not
        # in the working tree (they never are -- .gitignore excludes them), then installs them as
        # com.iai:cybele-api:1.0 / com.iai:cybele-impl:1.0. It uses `mvn install:install-file` when
        # Maven is on PATH (it is, on ubuntu-24.04) and writes the repository layout directly when
        # it is not; both paths produce the same on-disk result. It is idempotent, so a cache hit
        # above turns this into a verified no-op rather than a skipped step.
        run: scripts/bootstrap-vendor-jars.sh

      - name: Verify the local Maven repository
        working-directory: ${{ env.OPENCYBELE_DIR }}
        # A post-condition assertion, and a separator that keeps the log honest about which of
        # "installed" and "present and matching" happened.
        #
        # It is NOT what defends against a stale or poisoned cache, and the earlier comment here
        # claiming so was wrong. Measured: with a poisoned cache entry and no jars in the tree, the
        # step ABOVE restored from the tag, `cmp`'d against the installed artifact, saw the
        # mismatch and reinstalled -- so this step then passed, because the defence had already
        # fired. The defence is step 5's unconditional content comparison against the tag; in this
        # ordering --verify-only can never be the thing that observes the mismatch. What it does
        # still catch on its own is an installed artifact missing its generated .pom.
        #
        # Do not reorder these two steps. --verify-only fails OPEN when cybelle/*.jar are absent
        # from the working tree (it treats "no source jar to compare against" as not-a-failure), so
        # on its own, before a restore, it would pass over a corrupted installed artifact.
        run: scripts/bootstrap-vendor-jars.sh --verify-only

      # ---------------------------------------------------------------------------------------
      # 4 -- build the application. `installDist` (not `build`) because that is the layout
      #      OpenCybeleLauncher drives: build/install/opencybele/lib/*.jar, with the two vendor
      #      jars copied in beside the application jar.
      # ---------------------------------------------------------------------------------------
      - name: Build the OpenCybele application (installDist)
        working-directory: ${{ env.OPENCYBELE_DIR }}
        run: ./gradlew --no-daemon --console=plain --stacktrace installDist

      - name: Show what will be driven
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/$OPENCYBELE_DIR/build/install/opencybele"
          echo "application commit : $(git -C "$OPENCYBELE_DIR" rev-parse HEAD)"
          echo "harness commit     : $(git -C "$HARNESS_DIR" rev-parse HEAD)"
          echo "dist               : $dist"
          ls -l "$dist/lib"
          # Evidence that this is a headless run and needs no display. The application is a Swing
          # app; the scenario passes sim.headless=true, and with no DISPLAY the JVM is headless of
          # its own accord. Deliberately NO Xvfb: a virtual display is not the supported path here
          # (#17), and standing one up "to be safe" would hide a regression in headless mode and
          # contaminate the timing variance the goldens were measured against.
          printf '%-19s: %s\n' DISPLAY "${DISPLAY:-<unset>}"
          if [ -n "${DISPLAY:-}" ]; then
            echo "::warning::DISPLAY is set on this runner. The suite is supposed to run with no display."
          fi
          # OpenCybeleLauncher refuses to launch when any of these is set, because the JVM would
          # append flags nobody declared and announce it on stderr -- straight into the trace.
          for leaky in JAVA_TOOL_OPTIONS _JAVA_OPTIONS JDK_JAVA_OPTIONS; do
            printf '%-19s: %s\n' "$leaky" "${!leaky:-<unset>}"
          done

      # ---------------------------------------------------------------------------------------
      # 5 -- the suite.
      # ---------------------------------------------------------------------------------------
      - name: Run characterizationIT against the OpenCybele baseline
        working-directory: ${{ env.HARNESS_DIR }}
        # THE RETRY, AND WHY THERE IS ONE.
        #
        # The baseline carries a measured, un-fixable-in-Phase-1 nondeterminism: DEF-22, an
        # unbounded `latch.await()` in `Planning`, wedges the election at roughly 1 run in 45 at the
        # stock configuration (docs/defect-triage.md). A wedged run still exits 0 -- generation
        # keeps going, the clock bound still fires -- so it surfaces as a liveness or count failure
        # that looks exactly like real behavioural drift. There is no fingerprint that separates
        # the two. Re-running is the only test that does: drift is deterministic and fails again,
        # a wedge is a race and almost certainly does not.
        #
        # So: at most MAX_ATTEMPTS attempts, and the retry is DELIBERATELY NARROW.
        #   * Only the end-to-end class is retried. A failure in HarnessSelfCheckIT,
        #     ScenarioCatalogIT or SmokeScenarioIT is in-process and deterministic; those fail once
        #     and stay failed.
        #   * A retry is never silent. It raises a ::warning, writes a line into the job summary,
        #     and keeps the failed attempt's log and reports as an artifact. A green run that
        #     needed two attempts is a run somebody has to look at.
        #   * Two consecutive failures of the same scenario is a p ~ 5e-4 coincidence at the
        #     measured rate. That is a regression, and it goes red.
        run: |
          # GitHub runs `run:` blocks as `bash -e {0}`, and this step has to survive a failing
          # command in order to decide what to do about it. errexit off, deliberately; every
          # status is checked by hand below.
          set +e
          set -uo pipefail
          evidence="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
          results="build/test-results/characterizationIT"
          junit="$GITHUB_WORKSPACE/$HARNESS_DIR/.github/scripts/parity-junit.sh"
          chmod +x "$junit"
          mkdir -p "$evidence"

          status=1
          attempts=0
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            attempts="$attempt"
            log="$evidence/attempt-$attempt.log"
            echo "::group::characterizationIT -- attempt $attempt of $MAX_ATTEMPTS"
            ./gradlew --no-daemon --console=plain --stacktrace characterizationIT \
                -Popencybele.dist="$GITHUB_WORKSPACE/$OPENCYBELE_DIR/build/install/opencybele" \
                2>&1 | tee "$log"
            status="${PIPESTATUS[0]}"
            echo "::endgroup::"

            # Preserve this attempt's reports before the next one overwrites them.
            mkdir -p "$evidence/attempt-$attempt"
            [ -d "$results" ] && cp -r "$results" "$evidence/attempt-$attempt/test-results"
            [ -d build/reports/tests ] && cp -r build/reports/tests "$evidence/attempt-$attempt/reports"

            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::characterizationIT failed on all $MAX_ATTEMPTS attempt(s)."
              break
            fi
            if ! "$junit" smoke-failed "$results"; then
              echo "::error::characterizationIT failed, and the failure is NOT in the end-to-end" \
                   "scenario. Harness tests are deterministic and are not retried."
              break
            fi
            echo "::warning::The end-to-end scenario failed on attempt $attempt. Retrying once:" \
                 "the baseline wedges at ~1 run in 45 (DEF-22) with a failure that is" \
                 "indistinguishable from real drift except by re-running. See docs/ci.md."
            echo "PARITY_RETRIED=true" >> "$GITHUB_ENV"
          done

          {
            echo "### characterizationIT@opencybele"
            echo
            echo "* attempts: **$attempts** of $MAX_ATTEMPTS"
            echo "* final Gradle status: \`$status\`"
            if [ "$attempts" -gt 1 ]; then
              echo "* :warning: **This run needed a retry.** The first attempt's log and reports are"
              echo "  in the \`characterizationIT-opencybele-evidence\` artifact. Confirm it was the"
              echo "  DEF-22 wedge and not a real regression before ignoring it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # ---------------------------------------------------------------------------------------
      # 6 -- the assertion the exit status cannot make.
      # ---------------------------------------------------------------------------------------
      # THE SKIP ACCOUNTING IS PER JOB, and this line is why run 32548100423 was red.
      #
      # That run failed with "5 test(s) were skipped outside ParityGateIT" -- and the rule was
      # WORKING. The five were `JadeParityIT`, #36's JADE scenarios, which assume themselves away
      # here because this job supplies `-Popencybele.dist` and no `-Pjade.dist`. #78's exemption
      # named one class; there are two arms now, and #52 will bring a third, so the list moved into
      # `env:` above rather than becoming a second constant in the script.
      #
      # The bar #78 set is kept exactly: every named class must be skipped ENTIRELY. A
      # `JadeParityIT` that skipped 3 of its 5 here would mean two of them found a dist and RAN,
      # which is a different situation and still fails. Verified against a synthetic report.
      - name: Assert the end-to-end scenario RAN (and was not skipped)
        working-directory: ${{ env.HARNESS_DIR }}
        run: |
          set -euo pipefail
          export PARITY_OPT_IN_CLASSES="$OPENCYBELE_EXPECTED_SKIPS"
          chmod +x .github/scripts/parity-junit.sh
          .github/scripts/parity-junit.sh assert-ran build/test-results/characterizationIT

      # ---------------------------------------------------------------------------------------
      # 7 -- evidence. This suite's failures are trace diffs and count mismatches; a red run with
      #      nothing to read is nearly useless. The failure report the harness raises carries the
      #      diff, the exit disposition, the exact child command line and the last 20 captured
      #      lines, and it reaches all three of the captured log, the JUnit XML and the HTML report.
      # ---------------------------------------------------------------------------------------
      - name: Collect the golden and the scenario alongside the failure
        if: ${{ failure() || env.PARITY_RETRIED == 'true' }}
        run: |
          set -uo pipefail
          evidence="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
          mkdir -p "$evidence/parity-tests"
          cp -r "$HARNESS_DIR/parity-tests/golden" "$evidence/parity-tests/" 2>/dev/null || true
          cp -r "$HARNESS_DIR/parity-tests/scenarios" "$evidence/parity-tests/" 2>/dev/null || true
          # The scratch directory the child ran in. In practice this holds the staged
          # cybelle/*.prop files and nothing else -- the captured output lives in the failure
          # report, not on disk -- so it answers exactly one question: "did the child get the
          # kernel config it needed?". Useful when the child would not start; not a trace dump.
          cp -r "$HARNESS_DIR/build/parity-scratch" "$evidence/" 2>/dev/null || true

      - name: Upload the run evidence
        if: ${{ failure() || env.PARITY_RETRIED == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: characterizationIT-opencybele-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # L2 -- the integration lane (#38, TESTING.md 4.2). Its own job rather than a step in
  # `build@this-ref`, because it is its own lane with its own FIXTURE and a red here means
  # something different: `./gradlew build` must stay a build, so `check` compiles this source set
  # but does not run it (build.gradle.kts says so at the `integrationTest` task).
  #
  # IS IT SAFE ON A HOSTED RUNNER? Checked rather than assumed, because this lane boots real JADE
  # main containers in-process:
  #
  #   * THE PORT IS EPHEMERAL, NOT FIXED. `ContainerFixture` sets `Profile.MAIN_PORT = "0"`, so the
  #     kernel assigns a free port per container; nothing binds JADE's default 1099. It also sets
  #     `Profile.MTPS = ""` -- no external message transport, so no HTTP MTP on 7778 either -- and
  #     `Profile.GUI = "false"`. A hosted runner is a single-tenant VM, so even a fixed port would
  #     have been fine; an ephemeral one means it is fine on a self-hosted runner too.
  #   * `forkEvery = 1` MEANS 8 JVMs FOR 8 CLASSES, sequentially (`maxParallelForks = 1`). That is
  #     the lane's fixture, not a tuning knob: `TraceProbe.READY` is a latch counted down once with
  #     no reset hook and `jade.core.AID.platformID` is overwritten by every container boot, so one
  #     JVM per class is what makes `ProbeReadyTimeoutIT` and `ProbeFailureCapIT` testable at all.
  #     Measured locally at 26 s wall clock for the whole lane; a runner is slower but this is
  #     nowhere near a budget.
  #   * `jade.file.dir` IS ABSOLUTE, under `build/integration-test/jade`. JADE's AMS concatenates
  #     that value with "APDescription.txt" rather than resolving it, and #36 lost a gate run to a
  #     relative one. Nothing is written outside the workspace.
  #   * The per-class JUnit timeouts are 180 s (`ContainerFixture`) and 60 s (the two probe
  #     classes). Those are the numbers to look at first if this lane ever goes red on a slow
  #     runner rather than on a real failure -- and they are generous against a 3 s worst class.
  #
  # NOT VERIFIED LOCALLY, and it needs a real run to settle: whether a GitHub runner's slower,
  # contended CPU pushes any class near those timeouts. Everything above is a property of the
  # configuration and was read off the code and a local run; the timing headroom is not.
  # ---------------------------------------------------------------------------------------------
  integration-test:
    name: integrationTest@this-ref
    runs-on: ubuntu-24.04
    # Measured locally at 26 s for 8 forked JVMs. 20 minutes is a runaway guard, not a budget: the
    # slowest class's own JUnit timeout is 180 s, so anything near this ceiling is a stuck runner.
    timeout-minutes: 20

    steps:
      - name: Check out this ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `bootstrap-vendor-jars.sh` restores the untracked jars from the `withoutGradle` tag, so
          # the tag has to be in the clone. The default fetch-depth of 1 does not carry tags.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Bootstrap the vendored Cybele jars
        run: scripts/bootstrap-vendor-jars.sh

      - name: Run the L2 integration lane
        run: ./gradlew --no-daemon --console=plain --stacktrace integrationTest

      - name: Assert the L2 lane actually ran
        run: |
          set -euo pipefail
          export PARITY_MIN_TESTS="$INTEGRATION_TEST_FLOOR"
          # No exemptions: every test in this lane is supposed to run here. 0 skips, measured.
          export PARITY_OPT_IN_CLASSES=""
          chmod +x .github/scripts/parity-junit.sh
          .github/scripts/parity-junit.sh assert-suite build/test-results/integrationTest

      - name: Publish the integration test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: integration-test-results
          path: build/test-results/integrationTest/**/*.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # L3 -- THE PORT GUARD (#40). The same suite, the same untouched goldens, the application built
  # from THIS ref instead of from the frozen baseline.
  #
  # This is the job #75 asked for and the one #36's `JadeParityIT` has been waiting for since it
  # entered the tree: those five scenarios have NEVER run on a runner. Before this job they were a
  # test that could not fail, because nothing ever executed them.
  #
  # ONE CHECKOUT, unlike the opencybele arm. The harness and the JADE implementation are the same
  # tree, so there is no second branch to fetch and no `home` directory to stage -- `JadeLauncher`
  # needs the dist and nothing else, because the JADE implementation reads no `cybele.prop`.
  #
  # HOW THIS JOB DECIDES GREEN, in one paragraph; the full argument is in
  # `.github/scripts/parity-junit.sh` above `jade-status)` and the corpus tables are in
  # `.github/parity/jade-status.expected`. #39 measured the port over 20 runs per scenario and
  # classified the residue (b), normalizer gap, not closable: the JADE run emits the SAME EVENT
  # MULTISET as the 2008 application in all five scenarios, and every difference is burst placement
  # against a partition the goldens froze from the baseline's message latency. `strict` is 0/N in
  # every corpus ever taken -- and under concurrent load the BASELINE fails its own `strict` golden
  # 3/20, at the same line and in the same direction. So "five green" is not a bar this lane can
  # clear, and a job that is red forever teaches people to ignore CI, which is the exact failure
  # #78/#79 already paid for. This job therefore asserts the RECORDED MEASUREMENT: each scenario's
  # verdict class must equal what was measured, a change in EITHER direction is red, and a multiset
  # difference -- a dropped or invented event -- is red on all five and permitted nowhere.
  #
  # GRADLE'S EXIT STATUS IS DELIBERATELY NOT THE VERDICT HERE. `strict` fails its golden on
  # essentially every run by design, so `./gradlew characterizationIT` exits non-zero on essentially
  # every run. The run step records it and does not propagate it; the asserting step below is what
  # can turn this job red. That inverts this file's usual "trust Gradle, then assert more" shape,
  # and it is the one place in the repository where it is inverted.
  #
  # THE RUNNER IS A LOADED, SHARED MACHINE -- the worst case for a latency-keyed comparison, and
  # #39's own corpora move by 2-4x with machine load. That is exactly why nothing here is keyed on
  # a pass RATE. `capacity` and `congestion` are recorded as permitting MATCH *or* ORDER precisely
  # because a single run on a contended runner cannot distinguish those two as a signal; pinning
  # either would be pinning the runner rather than the program. Do NOT read this job's greens as
  # evidence of an idle-machine pass rate -- it is not measuring one.
  #
  # AND THE LANE HAS A CPU-THROUGHPUT FLOOR, measured for #40 rather than assumed, because "the
  # runner is loaded" is a claim that deserves a number (docs/ci.md 10.7):
  #
  #   24 cores quiet                             green 3/3
  #   4 DEDICATED cores (taskset -c 0-3), quiet  green 5/5   <- the hosted-runner model
  #   4 cores at ~50% steal                      red   3/3
  #   24 cores at 100% steal                     red   4/4
  #
  # Below the floor the failure mode is TRUNCATION: every scenario is bounded by an ABSOLUTE
  # `sim.stop.maxClockMs` at pace 8, so a machine that cannot keep up with simulated time reaches
  # the bound having emitted fewer events (`strict` 575 lines against 598). That surfaces as
  # BEHAVIOUR -- which is what a port that dropped an event looks like too, and there is no
  # fingerprint separating them, so a short run stays RED. `jade-status` prints a `HINT:` line
  # naming the truncation so the runner is checked before the port.
  #
  # It is NOT a property of the port or of this job: under the same starvation the drift guard
  # `characterizationIT@opencybele` also fails 3/3, with the FROZEN BASELINE no longer matching its
  # own goldens. The whole L3 lane has this floor, both arms, and it predates #40.
  #
  # NOT SETTLED LOCALLY: where a hosted `ubuntu-24.04` runner actually sits on that table. It is a
  # dedicated VM with a small fixed vCPU count and no competing tenant, which is the green row --
  # but that is a model, not a measurement, and only a real run settles it. If the first runs come
  # back red with `HINT:` short-run lines, the answer is NOT to edit `jade-status.expected`.
  # ---------------------------------------------------------------------------------------------
  characterization-jade:
    name: characterizationIT@jade
    runs-on: ubuntu-24.04
    # Measured locally at ~35 s of Gradle work for the whole suite (24 s of it in the five
    # scenarios). Doubled for the retry, then a wide runaway margin: the harness' own per-scenario
    # timeout is 120 s and the child's wall-clock net is 60 s.
    timeout-minutes: 25

    steps:
      - name: Check out this ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Bootstrap the vendored Cybele jars
        # Still needed on the port branch. See point 2 in this file's header: `src/main` has no
        # `cybele.*` reference left, but `build.gradle.kts` still declares the two coordinates on
        # `implementation`, so they resolve and land in the dist.
        run: scripts/bootstrap-vendor-jars.sh

      - name: Build the JADE application (installDist)
        # `installDist`, not `build`, for the reason the opencybele arm gives: that is the layout
        # the launcher drives -- build/install/opencybele/lib/*.jar -- and `JadeLauncher` invokes
        # `java -cp` on it directly, never `bin/opencybele`.
        run: ./gradlew --no-daemon --console=plain --stacktrace installDist

      - name: Show what will be driven
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/build/install/opencybele"
          echo "commit : $(git rev-parse HEAD)"
          echo "dist   : $dist"
          ls -l "$dist/lib"
          # Evidence that this is a headless run and needs no display. The scenarios pass
          # sim.headless=true, and with no DISPLAY the JVM is headless of its own accord.
          # Deliberately NO Xvfb: a virtual display is not the supported path (#17), and standing
          # one up "to be safe" would hide a regression in headless mode and contaminate the timing
          # variance this whole lane is keyed on.
          printf '%-19s: %s\n' DISPLAY "${DISPLAY:-<unset>}"
          if [ -n "${DISPLAY:-}" ]; then
            echo "::warning::DISPLAY is set on this runner. The suite is supposed to run with no display."
          fi
          # JadeLauncher refuses to launch when any of these is set, because the JVM would append
          # flags nobody declared and announce it on stderr -- straight into the trace.
          for leaky in JAVA_TOOL_OPTIONS _JAVA_OPTIONS JDK_JAVA_OPTIONS; do
            printf '%-19s: %s\n' "$leaky" "${!leaky:-<unset>}"
          done

      - name: Run characterizationIT against the JADE port
        # THE RETRY, AND WHY IT IS NARROWER THAN THE OPENCYBELE ARM'S.
        #
        # A retry is only ever legitimate against a failure mode that has been MEASURED to be a
        # transient, and it must be incapable of laundering the signal the job exists to carry.
        # Both conditions are met here, and `jade-retryable` is where they are enforced:
        #
        #   * The measured transient is T-12 (docs/parity-triage-jade.md 4.8): a cluster of slow
        #     JVM starts shifting the whole schedule against an ABSOLUTE stop bound, changing which
        #     events fall inside it. #39 chased it, found the schedule shifted rather than
        #     recomputed, and could not reproduce it in a second corpus. It is the only difference
        #     in that entire campaign that was not a reordering, and a loaded shared runner is the
        #     worst case for it. It shows up as verdict BEHAVIOUR.
        #   * A retry CANNOT hide a status change. `jade-retryable` is false for an unexpected
        #     MATCH -- `strict` going green is the thing this job is here to report, and retrying
        #     it would be a way of un-hearing it. It is false for OTHER (an agent died, the run
        #     missed its bound) because those are deterministic. It is false for any failure
        #     outside the scenario class, which are in-process harness tests. A retry here can
        #     therefore only ever DISCOVER a red, never convert one into a green it was not owed.
        #   * Two consecutive BEHAVIOUR diffs is not a transient. That is red, and it means a real
        #     behaviour difference: the port dropped or invented an event.
        #
        # Every retry is loud: a ::warning, a line in the job summary, and both attempts' reports
        # kept as an artifact.
        run: |
          # GitHub runs `run:` blocks as `bash -e {0}`, and this step has to survive a failing
          # command in order to decide what to do about it. errexit off, deliberately.
          set +e
          set -uo pipefail
          evidence="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
          results="build/test-results/characterizationIT"
          junit="$GITHUB_WORKSPACE/.github/scripts/parity-junit.sh"
          chmod +x "$junit"
          mkdir -p "$evidence"

          # The judge's per-job configuration. `JadeParityIT` is the class whose verdicts are read
          # and the only class a failure is tolerated in; the seven listed skips are the opencybele
          # scenarios plus the opt-in gate lane, none of which this job supplies a dist for.
          export PARITY_REQUIRED_CLASS=cz.vutbr.fit.ags.parity.it.JadeParityIT
          export PARITY_OPT_IN_CLASSES="$JADE_EXPECTED_SKIPS"

          gradle_status=1
          attempts=0
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            attempts="$attempt"
            log="$evidence/attempt-$attempt.log"
            echo "::group::characterizationIT@jade -- attempt $attempt of $MAX_ATTEMPTS"
            ./gradlew --no-daemon --console=plain --stacktrace characterizationIT \
                -Pjade.dist="$GITHUB_WORKSPACE/build/install/opencybele" \
                2>&1 | tee "$log"
            gradle_status="${PIPESTATUS[0]}"
            echo "::endgroup::"

            # Preserve this attempt's reports before the next one overwrites them.
            mkdir -p "$evidence/attempt-$attempt"
            [ -d "$results" ] && cp -r "$results" "$evidence/attempt-$attempt/test-results"
            [ -d build/reports/tests ] && cp -r build/reports/tests "$evidence/attempt-$attempt/reports"

            # NOT `gradle_status`. Gradle is non-zero on essentially every run of this lane by
            # design; the recorded measurement is what decides.
            if "$junit" jade-status "$results" "$JADE_EXPECTED" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              break
            fi
            if ! "$junit" jade-retryable "$results" "$JADE_EXPECTED"; then
              echo "::error::characterizationIT@jade is outside its recorded status, and the" \
                   "reason is NOT the one measured transient (T-12). Not retried."
              break
            fi
            echo "::warning::A scenario differed from its golden by MULTISET on attempt" \
                 "$attempt. That is T-12's signature -- a slow JVM start shifting the schedule" \
                 "against an absolute stop bound (docs/parity-triage-jade.md 4.8) -- and a loaded" \
                 "runner is its worst case. Retrying once. If it repeats, it is not a transient."
            echo "PARITY_RETRIED=true" >> "$GITHUB_ENV"
          done

          {
            echo "### characterizationIT@jade"
            echo
            echo "* attempts: **$attempts** of $MAX_ATTEMPTS"
            echo "* final Gradle status: \`$gradle_status\` (expected non-zero: \`opencybele-strict\`"
            echo "  fails its golden on essentially every run, by design -- see"
            echo "  \`.github/parity/jade-status.expected\`)"
            if [ "$attempts" -gt 1 ]; then
              echo "* :warning: **This run needed a retry**, on a multiset difference. Both"
              echo "  attempts' logs and reports are in the \`characterizationIT-jade-evidence\`"
              echo "  artifact. Confirm it was the T-12 startup shift before ignoring it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Always 0. The step below is the one that can turn this job red.
          exit 0

      # ---------------------------------------------------------------------------------------
      # The verdict. Prints the per-class table, then a per-scenario row of
      # verdict / recorded-status / ok-or-CHANGED, so a red build carries the numbers that
      # produced it and a green one carries the evidence that five scenarios actually ran.
      # ---------------------------------------------------------------------------------------
      - name: Assert every scenario matches its RECORDED status
        run: |
          set -uo pipefail
          export PARITY_REQUIRED_CLASS=cz.vutbr.fit.ags.parity.it.JadeParityIT
          export PARITY_OPT_IN_CLASSES="$JADE_EXPECTED_SKIPS"
          chmod +x .github/scripts/parity-junit.sh
          out="$(.github/scripts/parity-junit.sh jade-status \
                    build/test-results/characterizationIT "$JADE_EXPECTED" 2>&1)"
          status=$?
          echo "$out"
          # Fenced, so the per-scenario table keeps its columns in the rendered summary.
          {
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Collect the golden and the scenario alongside the failure
        if: ${{ failure() || env.PARITY_RETRIED == 'true' }}
        run: |
          set -uo pipefail
          evidence="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
          mkdir -p "$evidence/parity-tests"
          cp -r parity-tests/golden "$evidence/parity-tests/" 2>/dev/null || true
          cp -r parity-tests/scenarios "$evidence/parity-tests/" 2>/dev/null || true
          cp "$JADE_EXPECTED" "$evidence/" 2>/dev/null || true
          cp -r build/parity-scratch "$evidence/" 2>/dev/null || true

      - name: Upload the run evidence
        if: ${{ failure() || env.PARITY_RETRIED == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: characterizationIT-jade-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14

      # Always, unlike the opencybele arm's evidence. This lane's normal outcome includes a red
      # `strict`, so the JUnit XML is the thing a reader wants even on a green run -- it is where
      # the failure anatomy (DiffAnatomy's SAME MULTISET / DIFFERENT LINES verdict and the
      # burst-boundary margins) actually lives.
      - name: Publish the parity test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: characterizationIT-jade-test-results
          path: build/test-results/characterizationIT/**/*.xml
          if-no-files-found: warn
