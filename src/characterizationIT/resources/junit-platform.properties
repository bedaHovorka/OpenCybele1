# The parity suite is sequential, deliberately.
#
# ScenarioRunner's suite-fatal latch is static, the golden.record switch is a system property, and
# the implementations this harness will later drive have JVM-singleton runtimes. Enabling parallel
# execution would let the latch abort a concurrent class that had nothing to do with the poisoned
# environment, or let two scenarios disagree about record mode.
junit.jupiter.execution.parallel.enabled = false
