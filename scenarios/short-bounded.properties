# OpenCybele1 scenario -- "short, bounded, headless": scenarios/short.properties with a
# declared stop condition, a pinned seed and no GUI. This is the shape a harness
# (#23/#24) wants; short.properties itself is deliberately left unbounded so the
# measurements recorded against it stay comparable.
#
#   OPENCYBELE_OPTS=-Dsim.config=scenarios/short-bounded.properties \
#     build/install/opencybele/bin/opencybele ; echo $?
#
# No `timeout` in front of it: the run ends itself. Exit 0 means it reached the bound,
# exit 3 means the safety net fired instead, exit 4 means train generation died. See
# docs/headless-and-stop.md.
#
# READ scenarios/short.properties BEFORE COPYING THIS. Everything it says about the
# lambda/window split, about pace, and about the load ceiling applies here unchanged --
# in particular, the bound below keeps the run at 115 s of SIMULATED time, which is the
# regime short.properties was validated in (15-30 s of wall clock at pace 8). Raising
# sim.stop.maxClockMs past that puts the run above the load ceiling, where the same seed
# stops departing the same set of trains and no golden is recordable.

# Everything omitted keeps its default; see scenarios/default.properties.

sim.headless = true

sim.clock.pace = 8
sim.arrival.lambdaMs = 500
sim.station.voteWindowMs = 500
sim.arrival.firstFireMs = 200

# A golden is recorded against a seed, never against a draw.
sim.random.masterSeed = 20080415

# The bound: 115 s of simulated time, ~15 s of wall clock at pace 8.
sim.stop.maxClockMs = 115000

# The safety net, at ~4x the expected wall-clock duration. If this fires, the run hung;
# it exits 3 and must not be read as a completed scenario.
sim.stop.wallClockMs = 60000

# Trains arrive every ~500 simulated ms, i.e. ~62 real ms at pace 8. Ten seconds without
# one means generation has died, which the process cannot otherwise notice: a throwable
# in Generator.generateTrain before its timer re-arms stops generation permanently while
# everything else keeps running.
sim.stop.stallMs = 10000
