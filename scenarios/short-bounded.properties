# OpenCybele1 scenario -- "short, bounded, headless": a run that ENDS ON ITS OWN, with a
# pinned seed, no GUI and no `timeout` in front of it. Added by #17.
#
#   OPENCYBELE_OPTS=-Dsim.config=scenarios/short-bounded.properties \
#     build/install/opencybele/bin/opencybele ; echo $?
#
# Exit 0 means it reached the bound. Exit 3 means the wall-clock safety net fired
# instead, 4 means train generation died, 5 means the simulation clock never answered
# its command channel. See docs/headless-and-stop.md for the full table.
#
# WHY THIS IS NOT scenarios/short.properties WITH A BOUND
#
# It was, for one revision, and that file is ABOVE THE LOAD CEILING on the machine this
# was developed on: three runs of short.properties bounded at 115 s of simulated time
# produced two distinct traces (one departed vl107 where the others departed vl112).
# Above the ceiling the same seed departs a different SUBSET of the trains it generates
# -- the author's own `//BUG ne vzdy se doruci` in Planning, INVENTORY DEF-02 -- and no
# normalisation recovers a line the run never printed. A golden recorded there flakes.
# See docs/seeded-rng.md, "The load ceiling".
#
# So the arrival rate here is 2000 ms rather than short.properties' 500 ms, which is the
# densest setting measured to reproduce across three runs on this machine. It is still
# 4.25x the 8500 ms default, and pace 8 still buys 8 simulated seconds per wall second,
# so the run is ~15 s of wall clock. sim.station.voteWindowMs is scaled with it, exactly
# as short.properties does and for the same reason -- read that file's header before
# changing either, because moving the window alone is a change of station scheduling
# policy, not just of speed.
#
# Measured on this file as shipped, three runs: exit 0, 21 departures, 66 trains
# generated and the simulated clock at 115040-115072 ms in all three, with the DEPARTURE
# stream byte-identical across all three once timestamps are projected away. The one
# residual difference is two `<train> started` lines transposed -- vl12 and vl13, which
# depart at the SAME simulated instant (78136) -- so the SET of started trains is
# identical too and only their order at a shared instant moves. That is the pre-existing
# tie artifact docs/seeded-rng.md describes; it is present on the pre-#17 baseline as
# well, and #21's normalizer has to canonicalise order within an equal-departure group
# regardless. A golden recorded here must use that normalizer, not a bare timestamp strip.
#
# RE-VALIDATE BEFORE RAISING ANY OF THIS. The ceiling is a property of the machine as
# much as of the file. The test is cheap: three runs, diff the normalised traces.
#
# WHAT THE BOUND DOES AND DOES NOT PIN
#
#   * trains GENERATED is pinned by sim.stop.maxTrains, exactly, when that key is used.
#   * simulated time is pinned by sim.stop.maxClockMs to within one watchdog poll --
#     the run stops AT OR JUST PAST the bound (measured +80 simulated ms at pace 8).
#   * the DEPARTURE TAIL is ragged either way. The run stops promptly when the bound is
#     hit, so trains already planned but not yet departed simply never print. Do not read
#     a bound as a trace-length bound: this file generates 66 trains and departs 21.
#     A golden must compare the departure stream per train id, not by line count, and
#     tolerate the last line or two. See docs/headless-and-stop.md.

# Everything omitted keeps its default; see scenarios/default.properties.

sim.headless = true

# Wall-clock lever only: same simulated seconds, 8x faster.
sim.clock.pace = 8

# Simulated-time levers, kept equal to each other as short.properties explains.
sim.arrival.lambdaMs = 2000
sim.station.voteWindowMs = 2000
sim.arrival.firstFireMs = 200

# A golden is recorded against a seed, never against a draw.
sim.random.masterSeed = 20080415

# The bound: 115 s of simulated time, ~15 s of wall clock at pace 8.
sim.stop.maxClockMs = 115000

# The safety net, at ~4x the expected wall-clock duration. If this fires the run hung;
# it exits 3 and must not be read as a completed scenario.
sim.stop.wallClockMs = 60000

# Trains arrive every ~2000 simulated ms, i.e. ~250 real ms at pace 8. Ten seconds
# without one means generation has died, which nothing else notices: a throwable in
# Generator.generateTrain before its timer re-arms stops generation permanently while
# the process stays alive and green. The budget is WALL clock and is sized for the pace
# above; it is not meaningful for a GUI run where the toolbar can change pace mid-run.
sim.stop.stallMs = 10000
