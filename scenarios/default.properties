# OpenCybele1 scenario -- the historical defaults, written out in full.
#
# Every value here is what the corresponding literal was before #18 externalised it,
# so running with this file is indistinguishable from running with no configuration
# at all. It exists to be copied and edited, and to document the full key set.
#
#   ./gradlew run -Dsim.config=scenarios/default.properties
#
# A -D on the command line always wins over a value in this file, which in turn wins
# over the built-in default. Unknown keys are rejected at startup.

# --- train generation -------------------------------------------------------------
# Mean inter-arrival time (ms). The generator draws Exp(1/lambda) between trains.
sim.arrival.lambdaMs = 8500
# Delay before the generator's first fire (ms).
sim.arrival.firstFireMs = 1000
# Origin/destination table. One is drawn uniformly per train; order is significant
# because the RNG indexes this list.
sim.arrival.pairs = stA>stB,stA>stC,stB>stA,stB>stC,stC>stB,stC>stA

# --- station scheduling -----------------------------------------------------------
# Voting window and penalty quantum used by Station.computeDifference: it counts
# trains already planned within +/- this window, penalises by window/3 when the
# station is full, and by plannedTrains*window/6 when it is not.
#
# Before #18 this WAS sim.arrival.lambdaMs -- one constant, two jobs. They are now
# independent, with the same default, so a short scenario can raise the arrival rate
# without also rewriting the scheduling policy. See docs/scenario-config.md.
sim.station.voteWindowMs = 8500

# --- network ----------------------------------------------------------------------
# Edges as station-station:track. Order is significant: it is the insertion order
# into the graph, which the (HashMap-backed) iteration order downstream depends on.
sim.topology = stA-stH:tr1,stH-stG:tr2,stG-stE:tr3,stE-stD:tr4,stD-stB:tr5,stF-stE:tr6,stC-stF:tr7
# Platform count per station. Every station in sim.topology must appear, and nothing else.
sim.station.capacities = stA=6,stB=5,stC=2,stD=2,stE=5,stF=2,stG=3,stH=2
# Travel time per track, in SECONDS of simulated time. Every track must appear.
sim.road.delaysSec = tr1=1,tr2=1,tr3=5,tr4=2,tr5=3,tr6=4,tr7=3

# --- randomness -------------------------------------------------------------------
# Master seed for the per-agent random streams (#15). Either a signed 64-bit integer or
# the literal `random`, which draws one for this run and prints it to stderr with the
# command to replay it.
#
# `random` is the built-in default, so this line changes nothing -- it is here because
# THIS FILE IS THE FULL KEY SET, and a copy of it that omits the seed is a scenario that
# looks fully specified while quietly drawing a different seed on every run. That is the
# one way to record a golden under a configuration nobody chose without the unknown-key
# check catching it. A harness (#23/#24) should replace `random` with a number.
sim.random.masterSeed = random

# --- clock ------------------------------------------------------------------------
sim.clock.startMs = 0
sim.clock.pace = 1

# --- GUI (outside the behavioural contract) ---------------------------------------
# Toolbar buttons, Label=pace, in display order.
sim.gui.paces = Fast=8,Normal=1,Slow=0.3
# Stations drawn left to right on the canvas' single straight main line.
sim.gui.mainLine = stA,stH,stG,stE,stD,stB
# Branch stubs drawn above it, station:track, in slot order.
sim.gui.branches = stC:tr7,stF:tr6

# --- run control (added by #17) ---------------------------------------------------
# Whether to skip the Swing window. false keeps the GUI, which is what `./gradlew run`
# has always done. true is required on a JVM started with -Djava.awt.headless=true or
# with no display; starting one of those with sim.headless=false is rejected at startup
# rather than left to fail inside an agent constructor.
sim.headless = false

# Bounded stop condition. All four default to 0, which means "not armed" -- so this
# file still describes a run that never ends on its own, exactly as before #17.
#
# Two of them are BOUNDS and exit 0 when reached:
#   maxTrains   stop after this many trains have been GENERATED. Enforced inside
#               Generator, so it is exact.
#   maxClockMs  stop once the simulated clock is this far past sim.clock.startMs.
# Two of them are FAILURES and exit non-zero, because a run that ends this way did not
# reach the bound it declared:
#   wallClockMs safety net, in real milliseconds                    -> exit 3
#   stallMs     no train generated for this long, in real ms        -> exit 4
# See docs/headless-and-stop.md for the full exit-code table and for why a timeout must
# never look like a pass.
sim.stop.maxTrains = 0
sim.stop.maxClockMs = 0
sim.stop.wallClockMs = 0
sim.stop.stallMs = 0

# --- parity trace (added by #20) --------------------------------------------------
# The application itself prints exactly two lines -- "<train> in <station> at <n>" and
# "<train> started". Everything else it does reaches the Swing canvas through
# Observable/Observer and never touches a stream, so none of it can be compared against
# a port. sim.trace.enabled=true adds ONE passive agent (TraceProbe) that subscribes to
# all fifteen application channels and appends one canonical line per message to stdout:
#
#   agent|tick|event|from|to|performative|payload
#
# It is additive: it sends nothing, sets no timer and touches no application state, and
# false -- the default -- creates no probe agent and opens no extra channel, so
# `./gradlew run` is unchanged. The format is a CONTRACT, re-emitted by the JADE (#36)
# and Jason (#43) ports; see docs/trace-format.md before changing anything about it.
sim.trace.enabled = false

# How many train-name slots the probe keeps subscribed AHEAD of the generator.
#
# Four of the fifteen channels are named after a train that does not exist yet, and a
# train's first message is sent from its own constructor -- so subscribing on demand is
# too late and the probe pre-opens a sliding window of "vl<index>" names instead.
# Inert when sim.trace.enabled is false. The default is far wider than any generation
# burst these scenarios produce; if it were ever too narrow the probe says so loudly
# rather than losing lines quietly. See docs/trace-format.md.
sim.trace.trainLookahead = 32
