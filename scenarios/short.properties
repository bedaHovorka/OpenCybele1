# OpenCybele1 scenario -- "short": the default network with simulated-time arrival
# spacing compressed 17x (lambda 8500 -> 500 ms) and the clock running 8x faster, so a
# run that would take minutes takes seconds. Measured throughput gain against the
# default: 13.0x per wall-clock second at 15 s, 14.4x at 30 s.
#
#   OPENCYBELE_OPTS=-Dsim.config=scenarios/short.properties \
#     timeout 30 build/install/opencybele/bin/opencybele
#   ./gradlew run --console=plain -Dsim.config=scenarios/short.properties
#
# READ THIS BEFORE COPYING IT.
#
# sim.station.voteWindowMs is scaled here TOO, by the same factor, and that is a
# CHANGE OF STATION SCHEDULING POLICY, not just of the arrival rate. Station.compute-
# Difference counts trains planned within +/- the window and penalises by window/3 and
# plannedTrains*window/6; shrink the window and stations become far more willing to
# admit trains close together.
#
# Before #18 you had no choice: one constant, sim.arrival.lambdaMs, drove both, so
# every "make the test faster" edit silently retuned the voting behaviour as well.
# Splitting them did not make that trade-off go away -- it made it something you have
# to write down. Keeping the two equal, as here, is the closest short analogue of the
# default scenario (the historical ratio was exactly 1:1), and it is what produces
# throughput proportional to the arrival rate.
#
# If you want a shorter run with the scheduling policy left EXACTLY as the default,
# there are two other levers:
#   * scenarios/short-arrivals-only.properties -- raise arrivals, keep the 8500 ms
#     window. Same policy, far more queueing pressure. Measured side by side with this
#     file: 2x2 isolation of the two levers gives 28.7 -> 46.7 mean departures for the
#     lambda lever with the window untouched, and 46.7 -> 54.7 for the window lever at
#     lambda=500. At this arrival rate the throughput CEILING is the Planning/kernel
#     round-trip, not the window (~0.24 departures/simulated second against the 2.00
#     that lambda=500 demands, at either pace) -- what the window moves is the SHAPE of
#     the schedule, which is exactly what a golden pins.
#   * sim.clock.pace alone -- buy simulated seconds per wall-clock second without
#     touching any simulated-time parameter. Measured over a controlled simulated
#     window, pace 1 and pace 8 produce the same departures per SIMULATED second
#     (14.33 vs 13.33 in the first 110 s, Welch t = 0.671 -- indistinguishable), so
#     this is not a free lunch and not a behaviour change either: it is more simulated
#     time per wall second. Do NOT treat it as safe to vary between a golden recording
#     and its replay: the original documentation reports the message-loss defect (#22)
#     is worst at high pace, and one run at pace 8 was observed with its simulated
#     clock advancing at ~2.7x instead of 8x. See docs/scenario-config.md.
#
# The master seed (#15) is deliberately NOT pinned here. This file is used both for
# throughput measurement -- where every run must draw its own trains, or the statistics
# describe one seed rather than the scenario -- and as a harness scenario, where the seed
# must be fixed. Only the second case wants a constant, and it is one flag away, with -D
# winning over anything a file says:
#
#   OPENCYBELE_OPTS="-Dsim.config=scenarios/short.properties -Dsim.random.masterSeed=20080415" \
#     timeout 30 build/install/opencybele/bin/opencybele
#
# Uncomment to pin it in the file instead:
# sim.random.masterSeed = 20080415
#
# Everything omitted keeps its default; see scenarios/default.properties.

# Wall-clock lever: run the same simulated seconds 8x faster. Changes no
# simulated-time parameter at all; this is the "Fast" toolbar button as a default.
sim.clock.pace = 8

# Simulated-time levers.
sim.arrival.lambdaMs = 500
sim.station.voteWindowMs = 500
sim.arrival.firstFireMs = 200
