# OpenCybele1 scenario -- "short arrivals only": trains arrive ~17x more often than in
# the default scenario, and station scheduling policy is left EXACTLY as it is there.
#
#   OPENCYBELE_OPTS=-Dsim.config=scenarios/short-arrivals-only.properties \
#     timeout 30 build/install/opencybele/bin/opencybele
#
# This is the file that exists to make the #18 hazard visible. sim.station.voteWindowMs
# is deliberately NOT set, so it keeps its 8500 ms default while arrivals run at 500 ms.
# The expected result is a large generated-vs-departed gap: the generator produces
# trains at the new rate, and the unchanged voting window holds departures down to
# roughly the old rate.
#
# Before #18 this scenario was not expressible at all -- one constant drove both, so
# raising the arrival rate always dragged the scheduling policy along with it.
#
# Everything omitted keeps its default; see scenarios/default.properties.

sim.clock.pace = 8
sim.arrival.lambdaMs = 500
sim.arrival.firstFireMs = 200
